name: Checks

# Runs the scenario and browser suites, rebuilds docs/ and refuses a build
# that has drifted from its sources or that reaches for the network.
#
# Deployment is Vercel's job. The Pages steps at the end are dormant unless
# a Pages site exists, and are kept only as a fallback host.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Scenario checks
        run: node test/scenario.mjs

      - name: Browser checks
        run: npx playwright install --with-deps chromium && node test/ui.mjs

      - name: Build standalone pages
        run: node build.mjs

      - name: Check the build is self-contained
        run: |
          # The workshop has to run with the venue wifi down, so no page may
          # reference a remote script, stylesheet or image.
          if grep -rEq '<(script|link|img)[^>]+(src|href)="https?://' docs/; then
            echo "::error::External asset reference in docs/ - the simulation must run offline."
            grep -rEn '<(script|link|img)[^>]+(src|href)="https?://' docs/
            exit 1
          fi
          # The viewport tag is the one that silently ruins it on phones.
          for f in docs/index.html docs/facilitator.html; do
            test -s "$f" || { echo "::error::$f missing or empty"; exit 1; }
            grep -q '<meta name="viewport"' "$f" || { echo "::error::$f has no viewport meta"; exit 1; }
          done
          echo "docs/ is self-contained and mobile-ready"

      - name: Is the committed docs/ in sync with the sources?
        run: |
          # Under "Deploy from a branch" mode GitHub serves docs/ straight from
          # the repo, so stale built files would silently ship the wrong site.
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is out of date. Run 'node build.mjs' and commit the result."
            git diff --stat -- docs/
            exit 1
          fi
          echo "docs/ matches the sources"

      - name: How is Pages configured?
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' "${hdr[@]}" "$api")

          # build_type "workflow" means Pages publishes what this workflow
          # uploads. "legacy" means it serves docs/ from the branch itself, in
          # which case deploying from here is not just unnecessary, it would
          # fail. Branch mode uses an entirely separate pipeline to the Actions
          # deployment queue, which is why it is the reliable fallback.
          build_type=$(python3 -c "import json;print(json.load(open('/tmp/pages.json')).get('build_type',''))" 2>/dev/null || echo "")
          echo "build_type=$build_type"
          if [ "$build_type" != "workflow" ] && [ "$code" = "200" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Serving docs/ from the branch::Pages is in branch mode, so this workflow only builds and verifies. GitHub publishes docs/ directly."
            exit 0
          fi

          # Enabling Pages is normally a manual settings change, which is
          # awkward for anyone without a desktop to hand - the GitHub mobile
          # app has no repository settings at all.
          #
          # Creating the site from here does not work: the default
          # GITHUB_TOKEN gets 403 "Resource not accessible by integration"
          # on POST /pages even with pages:write, because site creation
          # needs repo administration rights the token cannot hold. The
          # attempt is left in because it costs one call, only fires while
          # there is no site, and would start working under a PAT with
          # admin rights. It is not a substitute for the settings toggle.
          if [ "$code" != "200" ]; then
            echo "No Pages site yet (HTTP $code). Attempting to create one."
            create=$(curl -s -o /tmp/pages_create.json -w '%{http_code}' -X POST "${hdr[@]}" \
              "$api" -d '{"build_type":"workflow"}')
            echo "create -> HTTP $create"
            cat /tmp/pages_create.json || true
            code=$(curl -s -o /dev/null -w '%{http_code}' "${hdr[@]}" "$api")
          fi

          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages site is available; publishing."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::The site built and validated fine, there is just nowhere to publish it, and this token could not create the site. Enable it in a browser at Settings -> Pages -> Source: GitHub Actions, then re-run."
          fi

      - uses: actions/configure-pages@v5
        if: steps.probe.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.probe.outputs.enabled == 'true'
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action defaults to giving up after 10 minutes. GitHub's Pages
          # queue can sit in deployment_queued for longer than that when a
          # previous deployment is wedged - which is exactly what happens
          # right after Pages is first switched on. Waiting longer costs
          # nothing and saves a manual re-run.
          timeout: 1800000
